<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/classical-d3de10a0-5b67-4da7-b5b3-8d49f26a63f1/styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&amp;display=swap">
<script src="_ds/classical-d3de10a0-5b67-4da7-b5b3-8d49f26a63f1/_ds_bundle.js"></script>
<style>:root{--font-heading:"Cormorant Garamond","Noto Serif SC",serif;--font-body:"Lora","Noto Serif SC",serif}</style>
</helmet>
<div style="width:216px;height:732px;box-sizing:border-box;border-right:1px solid var(--color-divider);display:flex;flex-direction:column;gap:20px;padding:24px 14px 16px;background:var(--color-bg);color:var(--color-text);font-family:var(--font-body)">
  <div style="padding:0 10px">
    <div style="font:400 27px/1 var(--font-heading);letter-spacing:-.01em">ROO<span style="font-style:italic;color:var(--color-accent-700)">Music</span></div>
    <div style="font-size:11px;color:var(--color-neutral-700);margin-top:5px;font-feature-settings:'tnum'">私人音乐库 · 2,318 张专辑</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;border:1px solid var(--color-divider);border-radius:var(--radius-md);padding:7px 10px;font-size:12.5px;color:var(--color-neutral-700)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:15px;height:15px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
    <span style="flex:1">搜索专辑、艺人、编号</span><span style="font-size:10px;border:1px solid var(--color-divider);border-radius:var(--radius-sm);padding:0 4px">⌘K</span>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <div style="font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700);padding:0 10px 6px">聆听</div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--radius-md);font-size:13.5px;color:{{ n.home.c }};background:{{ n.home.bg }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:16px;height:16px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path><path d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>概览</span></div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--radius-md);font-size:13.5px;color:{{ n.albums.c }};background:{{ n.albums.bg }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:16px;height:16px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><circle cx="12" cy="12" r="10"></circle><path d="M6 12c0-1.7.7-3.2 1.8-4.2"></path><circle cx="12" cy="12" r="2"></circle><path d="M18 12c0 1.7-.7 3.2-1.8 4.2"></path></svg><span>专辑</span></div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--radius-md);font-size:13.5px;color:{{ n.artists.c }};background:{{ n.artists.bg }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:16px;height:16px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg><span>艺人</span></div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--radius-md);font-size:13.5px;color:{{ n.library.c }};background:{{ n.library.bg }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:16px;height:16px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"></path></svg><span>收藏 · 历史 · 列表</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:2px">
    <div style="font-size:10px;letter-spacing:.16em;color:var(--color-neutral-700);padding:0 10px 6px">资料库</div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--radius-md);font-size:13.5px;color:{{ n.issues.c }};background:{{ n.issues.bg }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:16px;height:16px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"></path><path d="M12 9v4"></path><path d="M12 17h.01"></path></svg><span style="flex:1">元数据问题</span><span style="font-size:11px;color:var(--color-accent-700);font-feature-settings:'tnum'">7</span></div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--radius-md);font-size:13.5px;color:{{ n.scan.c }};background:{{ n.scan.bg }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:16px;height:16px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M10.7 20H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H20a2 2 0 0 1 2 2v4.1"></path><circle cx="17" cy="17" r="3"></circle><path d="m21 21-1.9-1.9"></path></svg><span style="flex:1">扫描目录</span><span style="font-size:11px;color:var(--color-neutral-700);font-feature-settings:'tnum'">64%</span></div>
    <div style="display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:var(--radius-md);font-size:13.5px;color:{{ n.audit.c }};background:{{ n.audit.bg }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:16px;height:16px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="m9 12 2 2 4-4"></path></svg><span style="flex:1">审批与日志</span><span style="font-size:11px;color:var(--color-accent-700);font-feature-settings:'tnum'">2</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid {{ n.steward.bd }};border-radius:var(--radius-md);font-size:13.5px;color:{{ n.steward.c }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:16px;height:16px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg><span>Music Steward</span></div>
  <div style="margin-top:auto;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--color-divider);padding:14px 10px 0">
    <div style="display:flex;align-items:center;gap:8px;font-size:12px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:15px;height:15px;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none;color:var(--color-accent-700)"><rect width="16" height="20" x="4" y="2" rx="2"></rect><path d="M12 6h.01"></path><circle cx="12" cy="14" r="4"></circle><path d="M12 14h.01"></path></svg><span>客厅 · USB DAC</span></div>
    <div style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--color-neutral-700)"><span style="width:22px;height:22px;border-radius:50%;border:1px solid var(--color-accent);display:grid;place-items:center;font:600 11px/1 var(--font-heading);color:var(--color-accent-700)">林</span><span>林 · 管理员</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:216,&quot;height&quot;:732},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;albums&quot;,&quot;artists&quot;,&quot;library&quot;,&quot;issues&quot;,&quot;scan&quot;,&quot;audit&quot;,&quot;steward&quot;],&quot;default&quot;:&quot;home&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'home';
    const n = {};
    ['home','albums','artists','library','issues','scan','audit'].forEach(k => {
      n[k] = k === a
        ? { c: 'var(--color-accent-700)', bg: 'color-mix(in srgb, var(--color-accent) 11%, transparent)' }
        : { c: 'var(--color-text)', bg: 'transparent' };
    });
    n.steward = a === 'steward'
      ? { c: 'var(--color-accent-700)', bd: 'var(--color-accent)' }
      : { c: 'var(--color-text)', bd: 'var(--color-divider)' };
    return { n };
  }
}
</script>
</body>
</html>
