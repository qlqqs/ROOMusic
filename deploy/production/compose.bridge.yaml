# 与生产 Compose 一起使用。此覆盖文件的 !reset 需要 Docker Compose v2.24.4 或更新版本。
services:
  app:
    network_mode: !reset null
    networks: [roomusic]
    environment:
      ROOMUSIC_HTTP_ADDR: "0.0.0.0:8080"
      ROOMUSIC_DATABASE_URL: "postgres://roomusic@postgres:5432/roomusic?sslmode=disable"
    ports:
      - "0.0.0.0:${ROOMUSIC_HTTP_PORT:-8090}:8080"
  postgres:
    ports: !reset []
