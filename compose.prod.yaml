# 将本文件存为 compose.yaml，在同目录的 .env 填写 ROOMUSIC_MUSIC_DIR，执行 docker compose up -d --wait。
# 在仓库根目录使用 .env.prod 时，执行 docker compose -f compose.prod.yaml --env-file .env.prod up -d --wait。
# 项目名默认 roomusic-server；本机生产实例可在对应环境文件里用 COMPOSE_PROJECT_NAME 指定为 roomusic-prod。
name: roomusic-server

x-postgres-image: &postgres-image postgres:18.1-alpine3.23@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  app:
    container_name: "${ROOMUSIC_APP_CONTAINER_NAME:-roomusic-app}"
    user: "${PUID:-1000}:${PGID:-1000}"
    image: "${ROOMUSIC_IMAGE:-ghcr.io/qlqqs/roomusic}:${ROOMUSIC_VERSION:-latest}"
    network_mode: host
    environment:
      ROOMUSIC_ENV: production
      ROOMUSIC_HTTP_ADDR: "0.0.0.0:${ROOMUSIC_HTTP_PORT:-8090}"
      ROOMUSIC_LAN_URL: "${ROOMUSIC_LAN_URL:-}"
      ROOMUSIC_DATABASE_URL: "postgres://roomusic@127.0.0.1:${ROOMUSIC_DB_PORT:-55439}/roomusic?sslmode=disable"
      ROOMUSIC_DB_PASSWORD_FILE: /run/secrets/postgres_password
      ROOMUSIC_ALLOWED_ORIGINS: "${ROOMUSIC_ALLOWED_ORIGINS:-}"
      ROOMUSIC_ALLOWED_LIBRARY_ROOTS: /music
      ROOMUSIC_SCAN_WORKERS: "${ROOMUSIC_SCAN_WORKERS:-4}"
      ROOMUSIC_DATA_DIR: /data
      ROOMUSIC_BACKUP_DIR: /backups
      ROOMUSIC_FPCALC_PATH: /usr/local/bin/fpcalc
      ROOMUSIC_FFMPEG_PATH: /usr/local/bin/ffmpeg
      ROOMUSIC_TIMEZONE: "${ROOMUSIC_TIMEZONE:-Asia/Shanghai}"
      ROOMUSIC_BACKUP_HOUR: "${ROOMUSIC_BACKUP_HOUR:-3}"
      ROOMUSIC_BACKUP_KEEP_DAYS: "${ROOMUSIC_BACKUP_KEEP_DAYS:-14}"
      ROOMUSIC_MEDIA_CACHE_MAX_MIB: "${ROOMUSIC_MEDIA_CACHE_MAX_MIB:-10240}"
    healthcheck:
      test: ["CMD-SHELL", 'wget -q -O /dev/null "http://127.0.0.1:$${ROOMUSIC_HTTP_ADDR##*:}/readyz"']
    volumes:
      - type: bind
        source: "${ROOMUSIC_MUSIC_DIR:?请在 .env 里填写 ROOMUSIC_MUSIC_DIR（音乐目录的绝对路径）}"
        target: /music
        read_only: true
        bind: { create_host_path: false }
      - ./data:/data
      - ./secrets:/run/secrets:ro
      - "${ROOMUSIC_BACKUP_DIR:-./backups}:/backups"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy, restart: true }
    restart: unless-stopped
    logging: *logging

  postgres:
    container_name: "${ROOMUSIC_POSTGRES_CONTAINER_NAME:-roomusic-postgres}"
    image: *postgres-image
    entrypoint:
      - /bin/sh
      - -ec
      - |
        password_file=$$POSTGRES_PASSWORD_FILE
        if [ ! -s "$$password_file" ]; then
          if [ -d "$$PGDATA" ]; then
            existing=$$(find "$$PGDATA" -mindepth 1 -maxdepth 1 -print -quit)
            if [ -n "$$existing" ]; then
              echo '数据库已存在但缺少密码文件 secrets/postgres_password，请从备份恢复该文件' >&2
              exit 1
            fi
          fi
          (
            umask 077
            set -o pipefail
            tmp=$$(mktemp "$$password_file.XXXXXX")
            trap 'rm -f "$$tmp"' EXIT
            od -An -v -N32 -tx1 /dev/urandom | tr -d ' \n' > "$$tmp"
            test "$$(wc -c < "$$tmp")" -eq 64
            mv "$$tmp" "$$password_file"
          )
        fi
        for dir in /run/secrets /prep/data /prep/backups; do
          if [ "$$(stat -c %u "$$dir")" = 0 ]; then
            chown "$$PUID:$$PGID" "$$dir" || echo "请在 NAS 上为 $$PUID:$$PGID 授予 $$dir 的读写权限" >&2
          fi
          if [ "$$(stat -c %a "$$dir")" != 700 ]; then
            chmod 0700 "$$dir" || echo "无法收紧 $$dir 的权限（网络存储或 ACL），请在 NAS 上只给 $$PUID:$$PGID 读写" >&2
          fi
        done
        chown "$$PUID:$$PGID" "$$password_file" || echo "请在 NAS 上将密码文件属主设为 $$PUID:$$PGID" >&2
        if [ "$$(stat -c %a "$$password_file")" != 600 ]; then
          chmod 0600 "$$password_file" || echo "无法收紧密码文件的权限，请在 NAS 上只给 $$PUID:$$PGID 读取" >&2
        fi
        exec docker-entrypoint.sh postgres
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      POSTGRES_DB: roomusic
      POSTGRES_USER: roomusic
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ./postgres:/var/lib/postgresql
      - ./secrets:/run/secrets
      - ./data:/prep/data
      - "${ROOMUSIC_BACKUP_DIR:-./backups}:/prep/backups"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomusic -d roomusic"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s
    networks: [roomusic]
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${ROOMUSIC_DB_PORT:-55439}:5432"

networks:
  # 默认由 Docker 分配子网；需要固定子网时在同目录放 compose.override.yaml（见部署说明）。
  roomusic:
    driver: bridge
