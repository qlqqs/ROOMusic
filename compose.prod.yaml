# 从仓库 main 分支下载 compose.prod.yaml、.env.prod.example 和 scripts/production-init.sh，分别存为部署目录里的 compose.yaml、.env 和 production-init.sh；执行 chmod 600 .env，首次安装先执行 sudo sh ./production-init.sh，再执行 docker compose up -d --wait。
# 在仓库根目录使用时，将 .env.prod.example 复制为 .env.prod，执行 chmod 600 .env.prod，首次安装先执行 sudo sh scripts/production-init.sh compose.prod.yaml .env.prod，再执行 docker compose -f compose.prod.yaml --env-file .env.prod up -d --wait。
# 项目名默认 roomusic-server；本机生产实例可在对应环境文件里用 COMPOSE_PROJECT_NAME 指定为 roomusic-prod。
name: roomusic-server

x-postgres-image: &postgres-image postgres:18.1-alpine3.23@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

services:
  app:
    container_name: "${ROOMUSIC_APP_CONTAINER_NAME:-roomusic-app}"
    image: "ghcr.io/qlqqs/roomusic:${ROOMUSIC_VERSION:-latest}"
    environment:
      ROOMUSIC_ENV: production
      ROOMUSIC_HTTP_ADDR: ":8080"
      ROOMUSIC_DATABASE_URL: "postgres://roomusic@postgres:5432/roomusic?sslmode=disable"
      ROOMUSIC_DB_PASSWORD_FILE: /run/secrets/postgres_password
      ROOMUSIC_ALLOWED_ORIGINS: "${ROOMUSIC_ALLOWED_ORIGINS:-}"
      ROOMUSIC_ALLOWED_LIBRARY_ROOTS: /music
      ROOMUSIC_SCAN_WORKERS: "${ROOMUSIC_SCAN_WORKERS:-4}"
      ROOMUSIC_DATA_DIR: /data
      ROOMUSIC_BACKUP_DIR: /backups
      ROOMUSIC_FFMPEG_PATH: /usr/local/bin/ffmpeg
      ROOMUSIC_TIMEZONE: "${ROOMUSIC_TIMEZONE:-Asia/Shanghai}"
      ROOMUSIC_BACKUP_HOUR: "${ROOMUSIC_BACKUP_HOUR:-3}"
      ROOMUSIC_BACKUP_KEEP_DAYS: "${ROOMUSIC_BACKUP_KEEP_DAYS:-14}"
      ROOMUSIC_MEDIA_CACHE_MAX_MIB: "${ROOMUSIC_MEDIA_CACHE_MAX_MIB:-10240}"
    ports:
      # 只发布 IPv4，避免公网 IPv6 绕过外部反代。
      - "0.0.0.0:${ROOMUSIC_HTTP_PORT:-8090}:8080"
    volumes:
      - type: bind
        source: "${ROOMUSIC_MUSIC_DIR:?请在 .env 里填写 ROOMUSIC_MUSIC_DIR（音乐目录的绝对路径）}"
        target: /music
        read_only: true
        bind: { create_host_path: false }
      - ./data:/data
      - ./secrets:/run/secrets:ro
      - "${ROOMUSIC_BACKUP_DIR:-./backups}:/backups"
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      postgres: { condition: service_healthy, restart: true }
    networks: [roomusic]
    restart: unless-stopped
    logging: *logging

  postgres:
    container_name: "${ROOMUSIC_POSTGRES_CONTAINER_NAME:-roomusic-postgres}"
    image: *postgres-image
    environment:
      POSTGRES_DB: roomusic
      POSTGRES_USER: roomusic
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - ./postgres:/var/lib/postgresql
      - ./secrets:/run/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roomusic -d roomusic"]
      interval: 5s
      timeout: 5s
      retries: 12
    stop_grace_period: 60s
    networks: [roomusic]
    restart: unless-stopped
    logging: *logging
    # 数据库不发布端口。

networks:
  # 默认由 Docker 分配子网；需要固定子网时在同目录放 compose.override.yaml（见部署说明）。
  roomusic:
    driver: bridge
