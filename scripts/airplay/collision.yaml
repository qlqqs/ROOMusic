services:
  port-holder:
    image: python:3.13-alpine@sha256:bf12ecc0bea3f171d55145dd02c78b5eeb09f30ee2ac9cc2b4c9e4e8f5e30741
    network_mode: service:app
    command:
      - python3
      - -c
      - |
        import socket, time
        ports = [socket.socket(socket.AF_INET, socket.SOCK_DGRAM) for _ in range(2)]
        for sock, port in zip(ports, (319, 320)):
            sock.bind(("0.0.0.0", port))
        print("occupied", flush=True)
        time.sleep(3600)
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
  homepod-advert:
    image: ${AIRPLAY_TEST_IMAGE:?}
    entrypoint: ["/airplay-probe", "advertise-homepod"]
    volumes:
      - ${AIRPLAY_PROBE:?}:/airplay-probe:ro
    read_only: true
    cap_drop: [ALL]
  cast:
    image: ${AIRPLAY_TEST_IMAGE:?}
    entrypoint: ["/fake-cast", "-name", "ROOMusic-Synthetic-Cast", "-http-addr", "0.0.0.0:8099"]
    volumes:
      - ${AIRPLAY_WORK:?}/roomusic-fake-cast:/fake-cast:ro
    read_only: true
    cap_drop: [ALL]
