<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>我的评分设计稿</title>
<style>
  body { margin: 0; background: #fff; color: #171717; font-family: system-ui, sans-serif; }
  .wrap { padding: 16px; display: grid; gap: 14px; max-width: 1040px; margin: 0 auto; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 13px; color: #666; }
  .bar .grp { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid #e5e5e5; border-radius: 8px; }
  .bar button { font: inherit; font-size: 12.5px; border: 0; background: none; padding: 4px 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
  .bar button:hover { background: #f4f4f5; }
  .bar button[aria-pressed="true"] { background: #171717; color: #fff; }
  .cap { font-size: 12.5px; color: #666; margin: 0 2px; line-height: 1.6; }

  .rm {
    --bg: #f3f2f2; --text: #201f1d; --t2: #605d5d; --accent: #b68235; --a4: #e1ad66; --a7: #7d5411; --sel: rgba(182,130,53,.11);
    --n1: #f8f4f4; --n3: #d7d3d3; --n4: #bab6b6; --n5: #9b9797; --hover: rgba(32,31,29,.06); --divider: rgba(32,31,29,.1);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    background: var(--bg); color: var(--text); font-size: 14px; border: 1px solid #e5e5e5; border-radius: 10px;
    margin: 0 auto; width: 100%; padding: 24px 32px 32px; box-sizing: border-box;
  }
  .rm[data-w="320"] { width: 320px; padding: 16px; }
  .rm * { box-sizing: border-box; }
  .rm button, .rm a { font: inherit; color: inherit; }
  .rm :focus-visible { outline: 2px solid var(--a7); outline-offset: 2px; }
  .ico { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; display: block; }
  h1 { margin: 0 0 14px; font-size: 24px; font-weight: 600; }

  /* 栏：同“我的收藏”的分类链接 */
  .tabs { display: flex; gap: 4px; list-style: none; margin: 0 0 16px; padding: 0; }
  .tabs a { display: inline-grid; place-items: center; height: 30px; padding: 0 14px; border-radius: 15px; text-decoration: none; color: var(--t2); cursor: pointer; }
  .tabs a:hover { background: var(--hover); color: var(--text); }
  .tabs a[aria-current="page"] { background: var(--text); color: var(--n1); }

  /* 工具行：左边筛选星级，右边排序与播放全部；窄屏换到两行 */
  .tools { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 12px; }
  .grow { flex: 1; }
  .filter { display: inline-flex; align-items: center; gap: 8px; }
  .filter [role="radiogroup"] { display: inline-flex; height: 32px; padding: 0 2px; border-radius: 4px; }
  .filter [role="radio"] { width: 24px; height: 32px; display: grid; place-items: center; border: 0; background: none; padding: 0; cursor: pointer; color: var(--n4); }
  .filter [role="radio"] .ico { width: 15px; height: 15px; stroke-width: 1.7; }
  .filter [role="radio"][data-on] { color: var(--a7); }
  .filter [role="radio"][data-on] .ico { fill: var(--accent); stroke: var(--accent); }
  .filter [role="radiogroup"]:hover { background: var(--hover); }
  .filter .txt { font-size: 12.5px; color: var(--t2); font-variant-numeric: tabular-nums; min-width: 5.5em; }
  .ib { width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; background: none; border-radius: 4px; color: var(--t2); cursor: pointer; }
  .ib:hover { background: var(--hover); color: var(--text); }
  .play { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px 0 12px; border: 0; border-radius: 4px; background: var(--accent); color: #fff !important; font-size: 13px; cursor: pointer; }
  .play .ico { fill: currentColor; width: 14px; height: 14px; }
  .note { font-size: 12.5px; color: var(--n5); margin: 12px 0 0; }

  /* 星级（同评分控件的紧凑尺寸，可直接改） */
  .stars { display: inline-flex; height: 28px; align-items: center; border-radius: 4px; padding: 0 1px; cursor: pointer; }
  .stars:hover { background: var(--hover); }
  .stars span { width: 18px; display: grid; place-items: center; color: var(--n4); }
  .stars span .ico { width: 13px; height: 13px; stroke-width: 1.7; }
  .stars span[data-on] { color: var(--accent); }
  .stars span[data-on] .ico { fill: currentColor; }

  /* 曲目表 */
  .table { display: grid; }
  .tr { display: grid; grid-template-columns: 28px minmax(0,1.4fr) minmax(0,1fr) auto 48px; gap: 12px; align-items: center; min-height: 48px; padding: 0 8px; border-radius: 4px; }
  .tr:hover { background: var(--hover); }
  .tr.head { min-height: 32px; color: var(--n5); font-size: 12px; }
  .tr.head:hover { background: none; }
  .no { color: var(--n5); text-align: right; font-variant-numeric: tabular-nums; }
  .t b { display: block; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t span, .alb { font-size: 12.5px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .d { color: var(--t2); font-size: 13px; text-align: right; font-variant-numeric: tabular-nums; }
  .rm[data-w="320"] .tr { grid-template-columns: minmax(0,1fr) auto; padding: 6px 4px; }
  .rm[data-w="320"] .tr .no, .rm[data-w="320"] .tr .alb, .rm[data-w="320"] .tr .d, .rm[data-w="320"] .tr.head { display: none; }

  /* 专辑格 */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 20px 16px; list-style: none; margin: 0; padding: 0; }
  .rm[data-w="320"] .grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px 12px; }
  .cover { aspect-ratio: 1; border-radius: 4px; }
  .card b { display: block; margin-top: 8px; font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card span.a { display: block; font-size: 12.5px; color: var(--t2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card .stars { margin-left: -2px; margin-top: 2px; }

  /* 艺人行 */
  .artists { list-style: none; margin: 0; padding: 0; display: grid; }
  .ar { display: grid; grid-template-columns: 40px minmax(0,1fr) auto; gap: 12px; align-items: center; min-height: 56px; padding: 0 8px; border-radius: 4px; }
  .ar:hover { background: var(--hover); }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 500; background: hsl(28 28% 87%); color: hsl(28 38% 26%); }
  .ar b { font-weight: 500; }
  .ar span { display: block; font-size: 12.5px; color: var(--t2); }

  /* 空状态 */
  .empty { display: grid; justify-items: center; gap: 10px; padding: 56px 16px; text-align: center; color: var(--t2); }
  .empty .big { width: 36px; height: 36px; color: var(--n4); stroke-width: 1.4; }
  .empty p { margin: 0; max-width: 30em; line-height: 1.6; }
  .empty b { color: var(--text); font-weight: 500; }
  .btn { height: 32px; padding: 0 14px; border: 1px solid var(--n3); border-radius: 4px; background: none; cursor: pointer; }
  .btn:hover { background: var(--hover); }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar">
    <span>宽度</span><span class="grp" id="wid"><button aria-pressed="true" data-v="full">桌面</button><button data-v="320">320px</button></span>
    <span>数据</span><span class="grp" id="data"><button aria-pressed="true" data-v="some">有评分</button><button data-v="none">一条都没有</button></span>
  </div>
  <p class="cap">
    筛选是五颗星的单选组：选第 N 颗表示“N 星及以上”，默认 1（全部评过分的）；读屏名“最低星级”，每颗读“N 星及以上”。排序是一个图标按钮，在“按评分”和“最近评分”之间切换，读屏名“排序：按评分”。
    每项的星级可以直接改，改完后这一页按新值重新读取（条目会移位或被筛掉）。地址：/me/ratings?tab=albums&amp;min=4&amp;sort=recent&amp;page=2，默认值不写。
  </p>

  <div class="rm" id="rm">
    <h1>我的评分</h1>
    <nav aria-label="评分分类"><ul class="tabs" id="tabs">
      <li><a data-tab="tracks" aria-current="page">曲目</a></li>
      <li><a data-tab="albums">专辑</a></li>
      <li><a data-tab="artists">艺人</a></li>
    </ul></nav>
    <div class="tools">
      <span class="filter"><span role="radiogroup" aria-label="最低星级" id="filter"></span><span class="txt" id="ftxt"></span></span>
      <span class="grow"></span>
      <button class="ib" id="sort"></button>
      <button class="play" id="playAll"><svg class="ico" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>播放全部</button>
    </div>
    <div id="body"></div>
    <p class="note" id="note"></p>
  </div>
</div>

<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="star" viewBox="0 0 24 24"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></symbol>
  <symbol id="byRating" viewBox="0 0 24 24"><path d="m3 16 4 4 4-4"/><path d="M7 20V4"/><path d="M11 4h10"/><path d="M11 8h7"/><path d="M11 12h4"/></symbol>
  <symbol id="byTime" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
</defs></svg>

<script>
const $ = (s) => document.querySelector(s);
const st = { w: "full", data: "some", tab: "tracks", min: 1, sort: "rating" };
const star = '<svg class="ico" viewBox="0 0 24 24"><use href="#star"/></svg>';
const tracks = [["Glass Harbor","合成乐队","Northern Lights Sessions",5,"3:48","11-24"],["Paper Lanterns","林间","Field Notes",5,"2:57","11-02"],["Aurora Drift","合成乐队","Northern Lights Sessions",4,"4:12","11-25"],["Low Tide, Late Train","Night Bus","Commuter",3,"5:03","11-20"],["Salt and Static","林间","Field Notes",2,"3:31","11-22"]];
const albums = [["Field Notes","林间",5,"11-18","#9fb0a3,#45564b"],["Northern Lights Sessions","合成乐队",4,"11-25","#c9b18f,#6f5a44"],["Commuter","Night Bus",4,"10-30","#8e9bb5,#3c4660"],["Halfway House","The Porches",2,"11-21","#c79c9c,#6b3f3f"]];
const artists = [["林间","2 张专辑 · 23 首",4,"11-10"],["合成乐队","1 张专辑 · 12 首",4,"11-25"],["Night Bus","3 张专辑",3,"11-01"]];
const data = { tracks, albums, artists };
const unit = { tracks: "首曲目", albums: "张专辑", artists: "位艺人" };
const what = { tracks: "曲目", albums: "专辑", artists: "艺人" };

function seg(id, key) {
  const g = $("#" + id);
  g.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    st[key] = b.dataset.v; render();
  });
}
seg("wid", "w"); seg("data", "data");
$("#tabs").addEventListener("click", (e) => { const a = e.target.closest("a"); if (!a) return; st.tab = a.dataset.tab; render(); });

// 筛选：radiogroup，方向键移动并选中（筛选是读操作，逐级切换无副作用）
const filter = $("#filter");
filter.innerHTML = [1,2,3,4,5].map((n) => `<button role="radio" data-n="${n}" aria-label="${n} 星及以上" title="${n} 星及以上">${star}</button>`).join("");
filter.addEventListener("click", (e) => { const b = e.target.closest("[role=radio]"); if (b) { st.min = Number(b.dataset.n); render(); filter.querySelector(`[data-n="${st.min}"]`).focus(); } });
filter.addEventListener("keydown", (e) => {
  const d = { ArrowRight: 1, ArrowUp: 1, ArrowLeft: -1, ArrowDown: -1 }[e.key]; if (!d) return;
  e.preventDefault(); st.min = Math.min(5, Math.max(1, st.min + d)); render(); filter.querySelector(`[data-n="${st.min}"]`).focus();
});
$("#sort").addEventListener("click", () => { st.sort = st.sort === "rating" ? "recent" : "rating"; render(); });

const stars = (v) => `<span class="stars" role="slider" tabindex="0" aria-valuetext="${v} 星" title="${v} 星">${[1,2,3,4,5].map((n) => `<span ${n <= v ? "data-on" : ""}>${star}</span>`).join("")}</span>`;

function emptyState(filtered) {
  if (!filtered) return `<div class="empty"><svg class="ico big" viewBox="0 0 24 24"><use href="#star"/></svg>
    <p><b>还没有评过分的${what[st.tab]}</b></p><p>在专辑、艺人页的头部，或曲目的“更多操作”里打分。</p></div>`;
  return `<div class="empty"><svg class="ico big" viewBox="0 0 24 24"><use href="#star"/></svg>
    <p><b>没有 ${st.min} 星及以上的${what[st.tab]}</b></p><button class="btn" id="reset">看全部评过分的</button></div>`;
}

function render() {
  $("#rm").dataset.w = st.w;
  document.querySelectorAll("#tabs a").forEach((a) => a.setAttribute("aria-current", a.dataset.tab === st.tab ? "page" : "false"));
  filter.querySelectorAll("[role=radio]").forEach((b) => {
    const n = Number(b.dataset.n);
    b.setAttribute("aria-checked", String(n === st.min)); b.tabIndex = n === st.min ? 0 : -1; b.toggleAttribute("data-on", n <= st.min);
  });
  $("#ftxt").textContent = st.min === 1 ? "全部" : `${st.min} 星及以上`;
  const s = $("#sort");
  s.innerHTML = `<svg class="ico" viewBox="0 0 24 24"><use href="#${st.sort === "rating" ? "byRating" : "byTime"}"/></svg>`;
  s.setAttribute("aria-label", `排序：${st.sort === "rating" ? "按评分" : "最近评分"}`); s.title = s.getAttribute("aria-label");
  $("#playAll").style.display = st.tab === "tracks" ? "" : "none";
  let rows = st.data === "none" ? [] : data[st.tab].filter((r) => r[st.tab === "tracks" ? 3 : 2] >= st.min);
  const ri = st.tab === "tracks" ? 3 : 2, ti = st.tab === "tracks" ? 5 : 3;
  rows = [...rows].sort((a, b) => (st.sort === "rating" ? b[ri] - a[ri] || b[ti].localeCompare(a[ti]) : b[ti].localeCompare(a[ti])));
  const body = $("#body");
  $("#note").textContent = rows.length ? `共 ${rows.length} ${unit[st.tab]}` : "";
  document.querySelector(".tools").style.display = st.data === "none" ? "none" : "";
  if (!rows.length) { body.innerHTML = emptyState(st.data !== "none"); $("#reset")?.addEventListener("click", () => { st.min = 1; render(); }); return; }
  if (st.tab === "tracks") {
    body.innerHTML = `<div class="table" role="table"><div class="tr head"><span class="no">#</span><span>标题</span><span>专辑</span><span>评分</span><span class="d">时长</span></div>` +
      rows.map((r, i) => `<div class="tr"><span class="no">${i + 1}</span><span class="t"><b>${r[0]}</b><span>${r[1]}</span></span><span class="alb">${r[2]}</span>${stars(r[3])}<span class="d">${r[4]}</span></div>`).join("") + `</div>`;
  } else if (st.tab === "albums") {
    body.innerHTML = `<ul class="grid">` + rows.map((r) => `<li class="card"><div class="cover" style="background:linear-gradient(135deg,${r[4]})"></div><b>${r[0]}</b><span class="a">${r[1]}</span>${stars(r[2])}</li>`).join("") + `</ul>`;
  } else {
    body.innerHTML = `<ul class="artists">` + rows.map((r) => `<li class="ar"><span class="av">${r[0][0]}</span><span><b>${r[0]}</b><span>${r[1]}</span></span>${stars(r[2])}</li>`).join("") + `</ul>`;
  }
}
render();
</script>
</body>
</html>
