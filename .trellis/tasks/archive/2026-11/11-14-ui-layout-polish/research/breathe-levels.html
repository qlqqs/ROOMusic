<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>呼吸动效定稿</title>
<style>
body{margin:0;background:var(--background,#fff);color:var(--foreground,#171717);font-family:var(--font-sans,system-ui,sans-serif)}
.wrap{padding:16px}
.rm{--n300:#d7d3d3;--n700:#605d5d;--line:color-mix(in srgb,#201f1d 10%,transparent);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--border,#e5e5e5);border-radius:8px;overflow:hidden;font-family:system-ui,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC","WenQuanYi Micro Hei",sans-serif;color:#201f1d}
.cell{padding:16px;display:grid;gap:16px;justify-items:center;background:color-mix(in srgb,#fff 35%,#f3f2f2)}
.cell:nth-child(even){border-left:1px solid var(--line)}
.cell.dark{background:#241d16;color:#f1ece6;border-top:1px solid #3a3530}
.t{font-size:13px;font-weight:600;justify-self:start}.t small{display:block;font-weight:400;font-size:12px;color:var(--n700);margin-top:2px;line-height:1.5}
.dark .t small{color:#b5ada4}
.zoom{width:120px;height:120px;display:grid;place-items:center;border-radius:12px;background:#fbfaf9;border:1px solid var(--line)}
.dark .zoom{background:rgba(255,255,255,.04);border-color:#3a3530}
.zoom .dot{width:48px;height:48px}
.pill{display:inline-flex;align-items:center;gap:9px;height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--n300);background:#fbfaf9;font-size:12px;font-weight:500;white-space:nowrap}
.dark .pill{background:rgba(255,255,255,.07);border-color:rgba(255,255,255,.18);color:#f4efe8}
.dot{width:8px;height:8px;border-radius:50%;background:var(--q);flex:none;position:relative}
.q{--q:#b68235}.dark .q{--q:#f0c27a}
/* 上一版：对称，靠 box-shadow 扩散 */
.old .dot{animation:old 4s ease-in-out infinite}
@keyframes old{0%,100%{opacity:.55;transform:scale(.9);box-shadow:0 0 0 0 color-mix(in srgb,var(--q) 30%,transparent)}50%{opacity:1;transform:scale(1);box-shadow:0 0 0 4px color-mix(in srgb,var(--q) 0%,transparent)}}
.zoom .old-z{animation:oldz 4s ease-in-out infinite}
@keyframes oldz{0%,100%{opacity:.55;transform:scale(.9);box-shadow:0 0 0 0 color-mix(in srgb,var(--q) 30%,transparent)}50%{opacity:1;transform:scale(1);box-shadow:0 0 0 24px color-mix(in srgb,var(--q) 0%,transparent)}}
/* 自然版：吸气短、呼气长、末尾停顿；内核缩到 78%；光晕独立一层，稍晚于内核绽开再散去 */
.nat .dot{animation:core 4s infinite}
.nat .dot::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--q);opacity:0;animation:glow 4s infinite;z-index:-1}
@keyframes core{
  0%{transform:scale(.78);opacity:.55;animation-timing-function:cubic-bezier(.37,0,.63,1)}
  38%{transform:scale(1);opacity:1;animation-timing-function:cubic-bezier(.45,.05,.3,1)}
  88%,100%{transform:scale(.78);opacity:.55}}
@keyframes glow{
  0%,8%{transform:scale(1);opacity:0;animation-timing-function:cubic-bezier(.3,0,.5,1)}
  42%{transform:scale(1.9);opacity:.26;animation-timing-function:cubic-bezier(.2,0,.4,1)}
  80%,100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.dot,.dot::after{animation:none!important}}
</style></head><body><div class="wrap"><div class="rm">
<div class="cell old"><div class="t">上一版<small>对称起伏，内核 90%↔100%，光晕由描边向外扩</small></div><div class="zoom"><span class="dot old-z q"></span></div><span class="pill q"><span class="dot"></span>FLAC 24/96</span></div>
<div class="cell nat"><div class="t">自然版（采用）<small>吸气约 1.5 秒、呼气约 2 秒、末尾停顿约 0.5 秒；内核 78%↔100%；柔光稍晚绽开再散去</small></div><div class="zoom"><span class="dot q"></span></div><span class="pill q"><span class="dot"></span>FLAC 24/96</span></div>
<div class="cell old dark"><div class="t">上一版 · 全屏深色</div><span class="pill q"><span class="dot"></span>FLAC 24/96</span></div>
<div class="cell nat dark"><div class="t">自然版 · 全屏深色</div><span class="pill q"><span class="dot"></span>FLAC 24/96</span></div>
</div></div></body></html>
