name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: roomusic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 固定已通过 CI 的 Ubuntu 24.04，以保持真实播放所需的 Chromium 系统库环境；后续升级须单独验证。
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Check module tidiness
        working-directory: backend
        run: go mod tidy -diff
      - name: Test
        working-directory: backend
        run: go test ./... -count=1
      - name: Race test
        working-directory: backend
        run: go test -race ./... -count=1
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke, accessibility and responsive checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  image:
    name: Production image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/production/Dockerfile
          push: false
          platforms: linux/amd64

  integration:
    name: PostgreSQL integration and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/go.sum
      - name: Set up shell checks
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Lint GitHub Actions workflows
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Validate Compose configuration
        env:
          PG_PASSWORD: ci-placeholder
        run: |
          docker compose -f compose.dev.yaml config --quiet
          docker compose -f compose.test.yaml config --quiet
          scripts/check-production-compose.sh
          for script in deploy/production/*.sh; do bash -n "$script"; done
          grep -qF "$(scripts/ffmpeg-pinned.sh --image)" deploy/production/Dockerfile
          scripts/fpcalc-pinned.sh --pins | while IFS= read -r pin; do
            grep -qF "$pin" deploy/production/Dockerfile || exit 1
          done
          grep -qF "golang:$(sed -n 's/^go = "\(.*\)"/\1/p' .mise.toml)-" deploy/production/Dockerfile
          node_version=$(sed -n 's/^node = "\(.*\)"/\1/p' .mise.toml)
          test -n "$node_version"
          grep -qF "node:${node_version}-" deploy/production/Dockerfile
          while IFS= read -r ci_node_version; do
            test "$ci_node_version" = "$node_version"
          done < <(sed -n 's/^[[:space:]]*node-version: *//p' .github/workflows/ci.yml | tr -d "\"'")
          pg_major=$(sed -n 's/^x-postgres-image: &postgres-image postgres:\([0-9][0-9]*\)\..*/\1/p' compose.prod.yaml)
          test -n "$pg_major"
          grep -qF "postgresql${pg_major}-client" deploy/production/Dockerfile
          grep -qF "PostgreSQL) ${pg_major}\\." deploy/production/Dockerfile
          grep -qF "$(sed -n 's/^x-postgres-image: &postgres-image //p' compose.prod.yaml)" scripts/pg-client-pinned.sh
          for compose_file in compose.dev.yaml compose.test.yaml; do
            grep -qF "image: $(sed -n 's/^x-postgres-image: &postgres-image //p' compose.prod.yaml)" "$compose_file"
          done
      - name: Test release checks
        run: python3 scripts/tests/test_release_check.py
      - name: Prepare pinned audio tools
        run: |
          ffmpeg_path="$(scripts/ffmpeg-pinned.sh)"
          fpcalc_path="$(scripts/fpcalc-pinned.sh)"
          echo "ROOMUSIC_TEST_FFMPEG=$ffmpeg_path" >> "$GITHUB_ENV"
          echo "ROOMUSIC_TEST_FPCALC=$fpcalc_path" >> "$GITHUB_ENV"
      - name: Run PostgreSQL 18 and pinned audio integration tests
        env:
          ROOMUSIC_TEST_PG_PASSWORD: ci-placeholder
        run: ./scripts/test-integration.sh
      - name: Check repository diff formatting
        run: git diff --check

  playback:
    name: Real playback (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Scan synthetic library and verify real playback (including pinned ffmpeg derivation)
        run: ./scripts/playback-e2e.sh
      - name: Upload real playback diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-real-playback
          path: |
            frontend/coverage/playback-real/report
            frontend/coverage/playback-real/results
          retention-days: 7
          if-no-files-found: ignore
