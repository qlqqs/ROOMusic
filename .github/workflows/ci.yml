name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roomusic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Test
        working-directory: backend
        run: go test ./... -count=1
      - name: Race test
        working-directory: backend
        run: go test -race ./... -count=1
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test -- --run
      - name: Detect frontend entry
        id: frontend-entry
        run: |
          if test -f frontend/src/main.tsx; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Frontend source is intentionally absent while the redesign is pending."
          fi
      - name: Production build
        if: steps.frontend-entry.outputs.available == 'true'
        working-directory: frontend
        run: npm run build
      - name: Check embedded asset drift
        if: steps.frontend-entry.outputs.available == 'true'
        run: |
          git diff --exit-code -- backend/cmd/roomusic/web
          test -z "$(git ls-files --others --exclude-standard -- backend/cmd/roomusic/web)"
      - name: Check frontend reset fallback
        if: steps.frontend-entry.outputs.available != 'true'
        run: test -f backend/cmd/roomusic/web/index.html

  integration:
    name: PostgreSQL integration and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/go.sum
      - name: Set up shell checks
        run: bash -n scripts/*.sh
      - name: Validate Compose configuration
        env:
          PG_PASSWORD: ci-placeholder
          MEILI_MASTER_KEY: ci-placeholder
        run: |
          docker compose config --quiet
          docker compose -f compose.test.yaml config --quiet
      - name: Run PostgreSQL 18 integration tests
        env:
          ROOMUSIC_TEST_PG_PASSWORD: ci-placeholder
        run: ./scripts/test-integration.sh
      - name: Check repository diff formatting
        run: git diff --check
