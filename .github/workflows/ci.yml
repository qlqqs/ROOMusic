name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: roomusic-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 固定已通过 CI 的 Ubuntu 24.04，以保持真实播放所需的 Chromium 系统库环境；后续升级须单独验证。
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/go.sum
      - name: Check formatting
        working-directory: backend
        run: test -z "$(gofmt -l .)"
      - name: Test
        working-directory: backend
        run: go test ./... -count=1
      - name: Race test
        working-directory: backend
        run: go test -race ./... -count=1
      - name: Vet
        working-directory: backend
        run: go vet ./...
      - name: Build
        working-directory: backend
        run: go build ./...

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Test
        working-directory: frontend
        run: npm run test
      - name: Production build
        working-directory: frontend
        run: npm run build
      - name: Check embedded asset drift
        run: |
          git diff --exit-code -- backend/cmd/roomusic/web
          test -z "$(git ls-files --others --exclude-standard -- backend/cmd/roomusic/web)"
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end smoke, accessibility and responsive checks
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: PostgreSQL integration and configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/go.sum
      - name: Set up shell checks
        run: |
          for script in scripts/*.sh; do bash -n "$script"; done
      - name: Validate Compose configuration
        env:
          PG_PASSWORD: ci-placeholder
          MEILI_MASTER_KEY: ci-placeholder
        run: |
          docker compose config --quiet
          docker compose -f compose.test.yaml config --quiet
          docker compose -f deploy/production/compose.yaml --env-file .env.prod.example config --quiet
          for script in deploy/production/*.sh; do bash -n "$script"; done
          grep -qF "$(scripts/ffmpeg-pinned.sh --image)" deploy/production/Dockerfile
          grep -qF "golang:$(sed -n 's/^go = "\(.*\)"/\1/p' .mise.toml)-" deploy/production/Dockerfile
          grep -qF "$(sed -n 's/^x-postgres-image: &postgres-image //p' deploy/production/compose.yaml) AS tools" deploy/production/Dockerfile
      - name: Run PostgreSQL 18 and pinned ffmpeg integration tests
        env:
          ROOMUSIC_TEST_PG_PASSWORD: ci-placeholder
        run: ./scripts/test-integration.sh
      - name: Check repository diff formatting
        run: git diff --check

  playback:
    name: Real playback (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25.10'
          cache-dependency-path: backend/go.sum
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Scan synthetic library and verify real playback (including pinned ffmpeg derivation)
        run: ./scripts/playback-e2e.sh
      - name: Upload real playback diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-real-playback
          path: |
            frontend/coverage/playback-real/report
            frontend/coverage/playback-real/results
          retention-days: 7
          if-no-files-found: ignore
