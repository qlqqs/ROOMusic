name: roomusic-compose-dev

services:
  postgres:
    image: postgres:18.1-alpine3.23@sha256:aa6eb304ddb6dd26df23d05db4e5cb05af8951cda3e0dc57731b771e0ef4ab29
    ports:
      # 开发依赖仅供本机访问，避免数据库端口暴露到局域网。
      - "127.0.0.1:${PG_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${PG_DATABASE:-roomusic}"
      POSTGRES_USER: "${PG_USER:-roomusic}"
      POSTGRES_PASSWORD: "${PG_PASSWORD:?请在 .env.dev 中设置 PG_PASSWORD}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-roomusic} -d ${PG_DATABASE:-roomusic}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres-data:
