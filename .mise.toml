[tools]
go = "1.25.10"
node = "24.22.1"

[tasks.env-up]
description = "启动本地开发依赖（PostgreSQL / Redis / Meilisearch）"
run = "docker compose --env-file .env.dev up -d --wait"

[tasks.env-down]
description = "停止本地开发依赖"
run = "docker compose --env-file .env.dev down"

[tasks.env-logs]
description = "查看本地开发依赖日志"
run = "docker compose --env-file .env.dev logs -f postgres redis meilisearch"

[tasks.env-check]
description = "检查工具链和 Compose 配置"
run = '''
mise current
docker compose --env-file .env.dev config --quiet
docker compose --env-file .env.dev ps
'''

[tasks.test-integration]
description = "启动临时 PostgreSQL 并运行集成测试"
run = "./scripts/test-integration.sh"
